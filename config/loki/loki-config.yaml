# Single-binary/filesystem mode - sized for a homelab, not microservices
# scale. tsdb + schema v13 is the current recommended combination for a
# new Loki install (confirmed against Loki's own docs; the older
# boltdb-shipper/schema v11 pattern is legacy).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h

ingester:
  wal:
    # Confirmed live (docker-green test run) - Loki's own default
    # (ingester.wal.dir, unset) is "/wal", outside /loki entirely. Only
    # /loki is part of the named volume whose ownership Docker
    # auto-initializes to the image's non-root user (10001:10001) - "/wal"
    # at the container root isn't, so the ingester failed to start
    # ("creating WAL folder at /wal: mkdir wal: permission denied").
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 744h # 31 days - adjust to taste
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  allow_structured_metadata: true
