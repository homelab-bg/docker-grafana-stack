services:
  # Only starts when the "full" profile is active (COMPOSE_PROFILES=full in
  # .env, or `docker compose --profile full up -d`) - the host actually
  # running the receiving server. Agent-only hosts never bring this up.
  #
  # NOTE: confirmed live that TrueNAS's app engine doesn't honor
  # COMPOSE_PROFILES from .env the same way the plain CLI does when
  # deployed via its Custom App include: mechanism - only alloy started.
  # Deliberately not re-solved here yet (tracked separately) - this
  # profile-based structure is correct for plain `docker compose`
  # deployments (docker-green, local testing); the TrueNAS deployment
  # path needs its own fix before relying on this against that host again.
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    profiles: ["full"]
    restart: unless-stopped
    # Loki's official image's own non-root user. Only matters for the
    # bind-mount override below (see README) - Docker auto-initializes a
    # fresh named volume's ownership from the image's own baked-in
    # /loki directory, so the chown-before-first-start problem is
    # specific to LOKI_DATA_PATH actually being set to a real host path.
    user: "10001:10001"
    volumes:
      # Named volume (declared below) by default - override with a real
      # host/dataset path (e.g. on TrueNAS, for ZFS snapshots/reliability)
      # by setting LOKI_DATA_PATH in .env. Resolution happens before
      # Compose decides bind-mount vs named-volume, so this works either
      # way from the same line.
      - ${LOKI_DATA_PATH:-loki_data}:/loki
      - ./config/loki/loki-config.yaml:/etc/loki/config.yaml:ro
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    networks: [grafana_stack]

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    profiles: ["full"]
    restart: unless-stopped
    # Grafana's official image's own non-root user - same note as loki's
    # about this only mattering for the bind-mount override case.
    user: "472:472"
    depends_on: [loki]
    volumes:
      - ${GRAFANA_DATA_PATH:-grafana_data}:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    ports:
      - "3000:3000"
    networks: [grafana_stack]

  # No profile - always starts, on every host (full-stack or agent-only
  # alike). Same image/config everywhere; the only thing that differs
  # per-host is LOKI_PUSH_URL in .env. Deliberately not split into a
  # separate repo - splitting would mean two places to bump the version
  # pin, and they'd drift eventually.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    volumes:
      - ${ALLOY_DATA_PATH:-alloy_data}:/var/lib/alloy/data
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # :ro only blocks writes to the socket *file* - it does not restrict
      # which Docker API calls can be made once connected (socket access is
      # binary, not read/write-scoped at the API level). Still the standard
      # convention; just don't mistake it for a real access restriction.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345" # Alloy's own UI - component graph/debugging, optional
      # Syslog receiver - only meaningful on hosts you've actually pointed
      # UDM/Proxmox/other syslog-forwarding config at (normally just the
      # full-stack host). Harmless idle listener everywhere else.
      - "514:514/udp"
    networks: [grafana_stack]

networks:
  grafana_stack:
    driver: bridge

# Named, not left implicit/anonymous - gives stable `docker volume`
# names regardless of which directory this repo happens to be cloned
# into (Compose otherwise prefixes volume names with the project name,
# normally derived from the directory name). Only actually created if a
# service's *_DATA_PATH is left unset - a declared-but-unreferenced
# volume here is harmless once overridden to a bind mount.
volumes:
  loki_data:
    name: loki_data
  grafana_data:
    name: grafana_data
  alloy_data:
    name: alloy_data
