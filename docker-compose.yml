services:
  # Always starts, on every host (full-stack or agent-only alike). Same
  # image/config everywhere; the only thing that differs per-host is
  # LOKI_PUSH_URL in .env. Deliberately not split into a separate repo -
  # splitting would mean two places to bump the version pin, and they'd
  # drift eventually.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    volumes:
      - ${ALLOY_DATA_PATH}:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # :ro only blocks writes to the socket *file* - it does not restrict
      # which Docker API calls can be made once connected (socket access is
      # binary, not read/write-scoped at the API level). Still the standard
      # convention; just don't mistake it for a real access restriction.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345" # Alloy's own UI - component graph/debugging, optional
      # Syslog receiver - only meaningful on hosts you've actually pointed
      # UDM/Proxmox/other syslog-forwarding config at (normally just the
      # full-stack host). Harmless idle listener everywhere else.
      - "514:514/udp"
    networks: [grafana_stack]

networks:
  grafana_stack:
    driver: bridge
