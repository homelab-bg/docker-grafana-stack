# Same self-labeling pattern the docker-truenas stacks use, applied to this
# stack's own containers too - without it, Alloy's job/stack relabeling
# (see config/alloy/base.alloy) has nothing to promote for loki/grafana/
# alloy themselves. STACK_NAME labels *this* stack for the monitoring
# system to query by - not "the stack that's monitoring", which is what
# the previous name (MONITORING_STACK) misleadingly implied.
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging_jobname: "containerlogs"
  stackname: ${STACK_NAME:-grafana-stack}

services:
  # Only starts when the "full" profile is active (COMPOSE_PROFILES=full in
  # .env, or `docker compose --profile full up -d`) - the host actually
  # running the receiving server. Agent-only hosts never bring this up.
  #
  # NOTE: confirmed live that TrueNAS's app engine doesn't honor
  # COMPOSE_PROFILES from .env the same way the plain CLI does when
  # deployed via its Custom App include: mechanism - only alloy started.
  # Deliberately not re-solved here yet (tracked separately) - this
  # profile-based structure is correct for plain `docker compose`
  # deployments (docker-green, local testing); the TrueNAS deployment
  # path needs its own fix before relying on this against that host again.
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    profiles: ["full"]
    restart: unless-stopped
    # Loki's official image's own non-root user. Only matters for the
    # bind-mount override below (see README) - Docker auto-initializes a
    # fresh named volume's ownership from the image's own baked-in
    # /loki directory, so the chown-before-first-start problem is
    # specific to LOKI_DATA_PATH actually being set to a real host path.
    user: "10001:10001"
    volumes:
      # Named volume (declared below) by default - override with a real
      # host/dataset path (e.g. on TrueNAS, for ZFS snapshots/reliability)
      # by setting LOKI_DATA_PATH in .env. Resolution happens before
      # Compose decides bind-mount vs named-volume, so this works either
      # way from the same line.
      - ${LOKI_DATA_PATH:-loki_data}:/loki
      - ./config/loki/loki-config.yaml:/etc/loki/config.yaml:ro
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    networks: [grafana]
    labels:
      <<: *default-labels
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    profiles: ["full"]
    restart: unless-stopped
    # Grafana's official image's own non-root user - same note as loki's
    # about this only mattering for the bind-mount override case.
    user: "472:472"
    depends_on: [loki]
    volumes:
      - ${GRAFANA_DATA_PATH:-grafana_data}:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    ports:
      - "3000:3000"
    networks: [grafana]
    # Traefik-specific labels (traefik.enable etc.) merge in on top of
    # these when docker-compose.traefik.yml is applied - labels merge as
    # a map across -f files/include:, same as networks/logging do, so
    # that overlay doesn't need to redeclare logging_jobname/stackname
    # itself.
    labels:
      <<: *default-labels
    logging: *default-logging

  # No profile - always starts, on every host (full-stack or agent-only
  # alike). Same image/config everywhere; the only thing that differs
  # per-host is LOKI_PUSH_URL in .env. Deliberately not split into a
  # separate repo - splitting would mean two places to bump the version
  # pin, and they'd drift eventually.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    volumes:
      - ${ALLOY_DATA_PATH:-alloy_data}:/var/lib/alloy/data
      # Directory-loading mode, not a single file - lets the syslog
      # receiver live in a genuinely separate file (full.alloy) that's
      # only mounted in on the intended receiving host, instead of every
      # agent-only host getting a listener it'll never use.
      - ./config/alloy/base.alloy:/etc/alloy/config.d/base.alloy:ro
      # Reuses COMPOSE_PROFILES directly (already set to "full" on the
      # full-stack host to gate loki/grafana below) rather than adding a
      # second toggle var - unset resolves to empty.alloy (no-op),
      # COMPOSE_PROFILES=full resolves to full.alloy (the real syslog
      # component). See config/alloy/full.alloy for why its filename is
      # load-bearing, and the README for the (currently moot) caveat
      # about multiple comma-separated profiles in one COMPOSE_PROFILES
      # value.
      - ./config/alloy/${COMPOSE_PROFILES:-empty}.alloy:/etc/alloy/config.d/syslog.alloy:ro
      # :ro only blocks writes to the socket *file* - it does not restrict
      # which Docker API calls can be made once connected (socket access is
      # binary, not read/write-scoped at the API level). Still the standard
      # convention; just don't mistake it for a real access restriction.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.d/
    ports:
      - "12345:12345" # Alloy's own UI - component graph/debugging, optional
      # Syslog receiver - the component behind this port only exists at
      # all when COMPOSE_PROFILES=full (see the volumes note above),
      # normally just the full-stack host. Still a published port
      # mapping on every host (Compose doesn't support conditional ports
      # within one service definition) - but with nothing listening
      # inside the container on agent-only hosts now, instead of an
      # always-on listener as before.
      - "514:514/udp"
    networks: [grafana]
    labels:
      <<: *default-labels
    logging: *default-logging

# Named, not left to Compose's auto-generated <project>_<network> default -
# same rationale as the volumes block below (stable regardless of which
# directory this repo happens to be cloned into), and matches the pattern
# docker-traefik-portainer/docker-vscode already use for the external
# traefik network.
networks:
  grafana:
    name: ${GRAFANA_NETWORK:-grafana}
    driver: bridge

# Named, not left implicit/anonymous - gives stable `docker volume`
# names regardless of which directory this repo happens to be cloned
# into (Compose otherwise prefixes volume names with the project name,
# normally derived from the directory name). Only actually created if a
# service's *_DATA_PATH is left unset - a declared-but-unreferenced
# volume here is harmless once overridden to a bind mount.
volumes:
  loki_data:
    name: loki_data
  grafana_data:
    name: grafana_data
  alloy_data:
    name: alloy_data
