---
# Traefik overlay - optional, same pattern as every other docker-truenas
# stack. The base docker-compose.yml stays LAN-only/plain HTTP by design
# (logging infra doesn't need public exposure - see README's "LAN-only,
# plain HTTP" note). Apply this only if you specifically want Grafana
# reachable via a real HTTPS hostname through the shared Traefik instance:
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml --profile full up -d
#
# Only grafana gets routed - loki/alloy stay LAN-only regardless of
# whether this overlay is applied. Every LOKI_PUSH_URL in this project
# points at a LAN hostname; exposing Loki's push/query API publicly isn't
# something this design assumes.
#
# No x-common-labels/x-logging anchors here, deliberately - the base
# docker-compose.yml already applies both to grafana unconditionally, and
# labels/logging merge as maps across -f files just like networks does,
# so this overlay only needs to add what's actually new (the traefik.*
# labels and the port/network changes).
services:
  grafana:
    ports: !reset []
    expose:
      - 3000
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`${GRAFANA_HOST:?set GRAFANA_HOST to Grafana's hostname}`)
      traefik.http.routers.grafana.tls: true
      traefik.http.routers.grafana.tls.certresolver: letsencrypt
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
      # Confirmed live (docker-green): without this, grafana being on two
      # networks (this one, and grafana for reaching Loki) leaves
      # Traefik's Docker provider to guess which one to actually connect
      # through - it picked grafana, which Traefik's own container
      # isn't attached to, so every proxied request hung until timeout
      # even though TLS/ACME and a direct wget from inside the traefik
      # container both worked fine. This pins it to the one network
      # Traefik itself is actually on.
      traefik.docker.network: ${NETWORK:-traefik}

networks:
  traefik:
    name: ${NETWORK:-traefik}
    external: true
