# Adds loki + grafana to the base docker-compose.yml - the receiving
# server, only meaningful on the full-stack host (currently: TrueNAS).
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
#
# Deliberately a separate file joined via -f/include:, not Compose
# profiles - confirmed live that TrueNAS's app engine doesn't honor
# COMPOSE_PROFILES from .env the same way the plain CLI does (ordinary
# ${VAR} substitution into YAML content worked fine; profile activation,
# a control-plane decision about which services exist in the resolved
# model at all, apparently isn't read the same way). Multi-file layering
# via include:'s path: list is already proven to work on this TrueNAS
# (same mechanism the Traefik overlay uses) - "which services run" is now
# purely "which files you list", nothing depends on an env var being
# honored correctly by whatever's doing the resolving.
services:
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    # Loki's official image's own non-root user. chown the data path to
    # match before first start (see README) - mismatched ownership is the
    # most common first-boot failure with this image.
    user: "10001:10001"
    volumes:
      - ${LOKI_DATA_PATH}:/loki
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    networks: [grafana_stack]

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    # Grafana's official image's own non-root user - same chown note as loki.
    user: "472:472"
    depends_on: [loki]
    volumes:
      - ${GRAFANA_DATA_PATH}:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    ports:
      - "3000:3000"
    networks: [grafana_stack]
